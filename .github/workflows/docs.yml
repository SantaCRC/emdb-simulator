name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: |
            docs/requirements.txt
            misc/robosuite/pyproject.toml
            misc/robocasa/setup.py

      - name: Install project + docs dependencies
        run: |
          python -m pip install --upgrade pip
          # scene_loader.py/robocasa_node.py import robosuite/robocasa at module
          # level, so autodoc needs them actually importable, not just mocked.
          pip install -e misc/robosuite
          pip install -e misc/robocasa
          pip install -r docs/requirements.txt

      - name: Build docs
        run: sphinx-build -b html source build/html
        working-directory: docs

      - uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/build/html
          retention-days: 7

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
