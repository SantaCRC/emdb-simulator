name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # docker.yml calls this so images are only published from tested code.
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (pytest, no ROS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: requirements-test.txt

      - run: pip install -r requirements-test.txt

      - name: Run pytest
        run: >
          pytest tests/ -v
          --cov=emdb_policy.scripted_policies
          --cov=emdb_policy.scripts.prepare_lift_demo_episodes
          --cov=emdb_simulator.core.camera_config
          --cov=emdb_simulator.core.video_recorder
          --cov-report=term --cov-report=xml

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

  ros2:
    name: ROS 2 Humble build + colcon test
    runs-on: ubuntu-latest
    container: ros:humble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (rosdep)
        run: |
          apt-get update
          rosdep update --rosdistro humble
          rosdep install --from-paths ros_packages/src --ignore-src -y --rosdistro humble

      - name: colcon build
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --base-paths ros_packages/src \
            --packages-select emdb_interfaces emdb_policy emdb_simulator

      # Runs the ament flake8/pep257/copyright linters and the package tests.
      # test_sim_thread_queue.py skips here: it needs robosuite, which this
      # job deliberately doesn't install (see docs.yml for the heavy install).
      - name: colcon test
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          colcon test --base-paths ros_packages/src \
            --packages-select emdb_interfaces emdb_policy emdb_simulator \
            --event-handlers console_direct+
          colcon test-result --verbose
