name: Docker

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [cpu, gpu]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      # Requires DOCKERHUB_USERNAME / DOCKERHUB_TOKEN repo secrets
      # (Settings -> Secrets and variables -> Actions) -- not something
      # this workflow can create for you.
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # RoboCasa's kitchen assets are intentionally NOT baked into the
      # image (see docker/Dockerfile.cpu/.gpu header comments and
      # docs/source/howto/running_on_cesga.md) -- they're bind-mounted in
      # at run time instead, so both variants stay well within a
      # hosted runner's disk/time budget here.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.variant }}
          push: true
          tags: |
            santacrc/emdb_simulator_${{ matrix.variant }}:latest
            santacrc/emdb_simulator_${{ matrix.variant }}:${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
