name: Docker

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Jazzy+Zenoh variants (docker/Dockerfile.{cpu,gpu}.jazzy) are
        # built and pushed alongside the Humble+CycloneDDS ones under a
        # separate `:jazzy`-prefixed tag, so both can be pulled
        # independently for comparison (see
        # docs/source/howto/running_on_cesga.md).
        include:
          - variant: cpu
            dockerfile: docker/Dockerfile.cpu
            image: cpu
            latest_tag: latest
            version_prefix: ""
          - variant: gpu
            dockerfile: docker/Dockerfile.gpu
            image: gpu
            latest_tag: latest
            version_prefix: ""
          - variant: cpu-jazzy
            dockerfile: docker/Dockerfile.cpu.jazzy
            image: cpu
            latest_tag: jazzy
            version_prefix: "jazzy-"
          - variant: gpu-jazzy
            dockerfile: docker/Dockerfile.gpu.jazzy
            image: gpu
            latest_tag: jazzy
            version_prefix: "jazzy-"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            santacrc/emdb_simulator_${{ matrix.image }}:${{ matrix.latest_tag }}
            santacrc/emdb_simulator_${{ matrix.image }}:${{ matrix.version_prefix }}${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
