# ament's default config (ament_flake8/configuration/ament_flake8.ini) plus:
#   max-line-length 120 instead of 99
#   F403/F405: task modules star-import robocasa's Kitchen API on purpose
#   E203: black-style slice spacing
[flake8]
extend-ignore = B902,C816,D100,D101,D102,D103,D104,D105,D106,D107,D203,D212,D404,I202,F403,F405,E203
import-order-style = google
max-line-length = 120
show-source = true
statistics = true
